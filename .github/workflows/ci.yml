name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# This job only ever reads the checkout and builds it, so it is given exactly
# that. Without the block a workflow inherits whatever the repository's default
# is, which on an older repository is read *and write* - a token with more
# reach than the job has any use for, handed to a build that compiles code from
# every branch. `pages.yml` already scopes its own.
permissions:
  contents: read

jobs:
  engine:
    name: Core engine + tests (no JUCE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The engine must build and test on a machine with no JUCE and no GUI
      # libraries - that is the module boundary, checked by CI rather than by
      # code review.
      - name: Configure
        run: cmake -S . -B build-core -DJAZZ_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-core

      - name: Test
        run: ctest --test-dir build-core --output-on-failure

      # The number of tests is quoted in two places a reader looks, and it has
      # gone stale twice already because nothing was checking it. The suite
      # itself is the only thing that knows the answer, and `tools/test-count.sh`
      # is the one place that knows how to ask it and where the answer is
      # written - so this runs that, rather than keeping a second copy of the
      # same grep. Contributors run the same script without `--check` to write
      # the number in, which is the half that used to be done by hand.
      - name: The quoted test count is the real one
        run: ./tools/test-count.sh --check

  app:
    name: Standalone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The app's UI is a web page in a webview, so the Linux build needs
      # WebKitGTK on top of the usual JUCE packages.
      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libfreetype6-dev libfontconfig1-dev \
            libglu1-mesa-dev mesa-common-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      # -DJAZZ_BUILD_TESTS=OFF: this job's question is whether the app links.
      # The option defaults to ON, so without it this compiled all fourteen
      # test files a second time - on the same runner image where the `engine`
      # job has already built *and run* them - and threw the binary away
      # without executing it.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJAZZ_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build
